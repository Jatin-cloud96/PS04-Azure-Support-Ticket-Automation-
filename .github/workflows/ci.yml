name: CI - PS03 Azure Invoice Processing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000

    env:
      PYTHONPATH: .
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create and activate virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Wait for Azurite Service
        run: |
          python -c "
          import socket, time
          for _ in range(30):
              try:
                  with socket.create_connection(('127.0.0.1', 10000), timeout=1):
                      print('Azurite is ready on port 10000.')
                      break
              except OSError:
                  time.sleep(1)
          "

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Sample Invoices Generation
        run: |
          python src/generators/generate_samples.py

      - name: Run Accuracy Benchmark Evaluation
        run: |
          python src/evaluation/evaluate_accuracy.py

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Run End-to-End Local Ingestion Demonstration
        run: |
          python scripts/run_local_demo.py
