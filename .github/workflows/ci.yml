name: CI - PS03 Azure Invoice Processing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000

    env:
      PYTHONPATH: .
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Verify Sample Invoices Generation
        run: |
          python src/generators/generate_samples.py

      - name: Run Accuracy Benchmark Evaluation
        run: |
          python src/evaluation/evaluate_accuracy.py

      - name: Wait for Azurite Service
        run: |
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 10000; then
              echo "Azurite Blob Service is actively listening on port 10000."
              exit 0
            fi
            echo "Waiting for Azurite on port 10000... ($i/30)"
            sleep 1
          done
          echo "Error: Azurite service container did not start in time."
          exit 1

      - name: Run Pytest Suite
        run: |
          python -m pytest -v --tb=short > pytest_output.log 2>&1 || {
            cat pytest_output.log
            ERR=$(tail -n 20 pytest_output.log | tr '\n' ' ')
            echo "::error title=Pytest Failure::$ERR"
            exit 1
          }

      - name: Run End-to-End Local Ingestion Demonstration
        run: |
          python scripts/run_local_demo.py
