name: CI - PS03 Azure Invoice Processing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js for Azurite Emulator
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Azurite Storage Emulator
        run: |
          npm install -g azurite
          azurite --version

      - name: Start Azurite in Background
        run: |
          mkdir -p .azurite
          azurite --silent --skipApiVersionCheck --location .azurite --blobHost 127.0.0.1 --blobPort 10000 &
          sleep 3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Sample Invoices Generation
        run: |
          python src/generators/generate_samples.py

      - name: Run Accuracy Benchmark Evaluation
        run: |
          python src/evaluation/evaluate_accuracy.py

      - name: Run Pytest Suite
        run: |
          pytest -v --tb=short

      - name: Run End-to-End Local Ingestion Demonstration
        run: |
          python scripts/run_local_demo.py
